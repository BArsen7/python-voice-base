# Порядок стадий = порядок оптимизации.
# КАЖДАЯ стадия оптимизируется при фиксированных остальных параметрах.
# Более важные стадии — раньше.

stages:
  # 1. Главный рычаг DER: число спикеров.
  #    max_speakers: чем меньше — тем сильнее over-clustering подавляется.
  - name: "clustering_count"
    params:
      "clustering.max_speakers": [4, 5, 6, 8]

  # 2. Порог агломерации — баланс under/over-clustering.
  #    Смотрите на Δspk: если pred > ref — повышайте, если pred < ref — понижайте.
  - name: "clustering_threshold"
    params:
      "clustering.threshold": [0.60, 0.65, 0.70, 0.75, 0.80, 0.85]

  # 3. Эмбеддинги: размер окна и шаг.
  #    window_sec влияет на confusion, hop_sec — на RTF.
  - name: "embeddings"
    params:
      "embeddings.window_sec": [1.0, 1.5, 2.0]
      "embeddings.hop_sec": [0.5, 0.75, 1.0]

  # 4. VAD: баланс miss vs false alarm.
  - name: "vad"
    params:
      "vad.threshold": [0.4, 0.5, 0.6]
      "vad.min_speech_duration_ms": [200, 250, 400]
