pipeline:
  sample_rate: 16000
vad:
  model: silero_vad
  threshold: 0.5
  min_speech_duration_ms: 250
  speech_pad_ms: 30
overlap:
  enabled: true
  model: energy_heuristic
  threshold: 0.5
  min_overlap_duration_ms: 100
embeddings:
  model: wespeaker_resnet34
  embedding_dim: 256
  window_sec: 1.5
  hop_sec: 0.75
clustering:
  algorithm: agglomerative
  threshold: 0.92
  max_speakers: 10
  linkage: average
asr:
  model: faster_whisper_small
  language: en
  word_timestamps: true
alignment:
  overlap_ratio_threshold: 0.5
  merge_same_speaker_gap_ms: 200
