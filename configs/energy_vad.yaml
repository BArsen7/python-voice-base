pipeline:
  sample_rate: 16000
vad:
  model: "energy_vad"
  energy_threshold_db: -35.0
  min_speech_duration_ms: 250
  min_silence_duration_ms: 100
  speech_pad_ms: 30
overlap:
  enabled: true
  model: "energy_heuristic"
  threshold: 0.5
  min_overlap_duration_ms: 100
embeddings:
  model: "ecapa_tdnn"
  embedding_dim: 192
  window_sec: 1.5
  hop_sec: 0.75
clustering:
  algorithm: "agglomerative"
  threshold: 0.8
  max_speakers: 8
  linkage: "average"
asr:
  model: "faster_whisper_small"
  language: "en"
  word_timestamps: true
alignment:
  overlap_ratio_threshold: 0.5
  merge_same_speaker_gap_ms: 200
