alignment:
  merge_same_speaker_gap_ms: 500
  overlap_ratio_threshold: 0.5
  ensure_monotonic: false
asr:
  language: ru
  model: sherpa_onnx_zipformer
  encoder: models/sherpa-onnx-zipformer-ru-2025-04-20/encoder.onnx
  decoder: models/sherpa-onnx-zipformer-ru-2025-04-20/decoder.onnx
  joiner: models/sherpa-onnx-zipformer-ru-2025-04-20/joiner.onnx
  tokens: models/sherpa-onnx-zipformer-ru-2025-04-20/tokens.txt
clustering:
  algorithm: agglomerative
  linkage: average
  max_speakers: 10
  threshold: 0.92
embeddings:
  embedding_dim: 256
  hop_sec: 0.75
  model: wespeaker_resnet34
  window_sec: 1.5
  use_onnx: true
  onnx_path: models/wespeaker_resnet34.onnx
overlap:
  enabled: true
  min_overlap_duration_ms: 100
  model: energy_heuristic
  threshold: 0.5
pipeline:
  sample_rate: 16000
vad:
  min_speech_duration_ms: 250
  model: silero_vad
  speech_pad_ms: 30
  threshold: 0.5
